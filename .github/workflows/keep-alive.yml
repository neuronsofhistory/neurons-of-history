# Supabase's free tier pauses a project after ~7 days without activity.
# This job queries the database every 3 days so the public site never goes offline.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL              e.g. https://<project-ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  sb_publishable_...
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 500 ] || [ "$status" = "000" ]; then exit 1; fi
